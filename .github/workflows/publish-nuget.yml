name: publish-nuget

on:
  workflow_dispatch:

concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-verify-publish:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Rewind.slnx --locked-mode
      - run: dotnet build Rewind.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/Rewind.Tests --configuration Release --no-build
      - shell: pwsh
        run: ./scripts/build-artifacts.ps1
      - shell: pwsh
        run: ./scripts/generate-sbom.ps1
      - shell: pwsh
        run: ./scripts/generate-checksums.ps1
      - shell: pwsh
        run: ./scripts/verify-artifacts.ps1
      - name: Request short-lived NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: sorawitphumwaree
      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $source = "https://api.nuget.org/v3/index.json"
          dotnet nuget push "artifacts/dist/packages/Rewind.Abstractions.$version.nupkg" --api-key $env:NUGET_API_KEY --source $source
          dotnet nuget push "artifacts/dist/packages/Rewind.Protocol.$version.nupkg" --api-key $env:NUGET_API_KEY --source $source
          dotnet nuget push "artifacts/dist/packages/Rewind.Sdk.$version.nupkg" --api-key $env:NUGET_API_KEY --source $source
